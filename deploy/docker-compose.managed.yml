# One isolated BlackLabs Invoicing instance for one client, on SQLite.
#
# SQLite rather than Postgres because the Postgres migration chain does not
# complete — see docs/POSTGRES-STATUS.md. This is upstream's tested path and
# it works today. docker-compose.postgres.yml is the Postgres variant, kept
# ready for when that chain is fixed.
#
# Isolation here is per-instance, not per-schema: each client gets its own
# container, its own volume and its own database file. Nothing is shared.
#
# Nothing is published on a public interface. The frontend binds to 127.0.0.1
# and an authenticating proxy in front of it decides who gets through. The app
# has no authentication of its own — exposing this port directly to the
# internet publishes the client's billing records to anyone who finds it.

name: ${CLIENT_SLUG}

services:
  backend:
    image: ${IMAGE}
    container_name: ${CLIENT_SLUG}-backend
    restart: unless-stopped
    environment:
      SERVICE: backend
      NODE_ENV: docker
      PORT: '3000'
      DEV_SERVER_URL: 0.0.0.0
      FE_SERVER_URL: ${PUBLIC_URL}
      MIGRATIONS_PATH: /app/dist-be/backend/server/shared/migrations
      BLACKLABS_MANAGED: 'true'
      BLACKLABS_DB: sqlite
      BLACKLABS_SQLITE_PATH: /data/invoicing.sqlite
      BLACKLABS_SEED_LOCALE: ${SEED_LOCALE:-us}
      DB_DIRECTORY: /data
    volumes:
      - app-data:/data
    healthcheck:
      # /api/health returns 503 until the pinned database is connected, so this
      # gates the frontend on a genuinely usable backend, not just an open port.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    image: ${IMAGE}
    container_name: ${CLIENT_SLUG}-frontend
    restart: unless-stopped
    # Loopback only. The authenticating proxy is the sole route in.
    ports:
      - '127.0.0.1:${HOST_PORT}:3001'
    environment:
      SERVICE: frontend
      BACKEND_HOST: backend
      BACKEND_PORT: '3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  app-data:
    name: ${CLIENT_SLUG}-data
